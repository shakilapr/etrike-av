# Kinect v2 FRONT — E-Trike
# Find serial with: ./run.sh discover
kinect_front:
  ros__parameters:
    serial: "500076343042"
    color_enabled: true
    depth_enabled: true
    ir_enabled: false
    registration_enabled: true
    frame_id_color: "kinect_front_rgb_optical_frame"
    frame_id_depth: "kinect_front_depth_optical_frame"
    frame_id_ir: "kinect_front_ir_optical_frame"
    reconnect_attempts: 3
    reconnect_delay_s: 2.0
    discover_interval_s: 1.0
    frame_timeout_ms: 1000
    poll_interval_ms: 100
