# Kinect v2 REAR — E-Trike
# Find serial with: ./run.sh discover
kinect_rear:
  ros__parameters:
    serial: ""  # fill after running: ros2 run etrike_kinect2 kinect2_node_exec --discover
    color_enabled: true
    depth_enabled: true
    ir_enabled: false
    registration_enabled: true
    frame_id_color: "kinect_rear_rgb_optical_frame"
    frame_id_depth: "kinect_rear_depth_optical_frame"
    frame_id_ir: "kinect_rear_ir_optical_frame"
    reconnect_attempts: 3
    reconnect_delay_s: 2.0
    discover_interval_s: 1.0
    frame_timeout_ms: 1000
    poll_interval_ms: 100
