name: E-Trike CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Python lint (our_packages)
        run: ruff check autoware/src/our_packages/ --select E,F,W --ignore E501
      - name: C++ format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find autoware/src/our_packages -name '*.cpp' -o -name '*.hpp' | head -50 | xargs clang-format --dry-run --Werror 2>/dev/null || echo "clang-format not available or files differ"

  patch-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Nebula patch script syntax
        run: bash -n scripts/apply_nebula_firetime_patch.sh
      - name: Verify bootstrap script syntax
        run: bash -n scripts/bootstrap_workspace.sh
      - name: Verify build script syntax
        run: bash -n docker/build.sh
      - name: Verify test script syntax
        run: bash -n run_tests.sh

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run pure-math stability guard tests (no ROS required)
        run: |
          cd autoware/src/our_packages/etrike_stability_guard
          python -m pytest test/test_stability_guard.py -v -k "TestLateralAccelFormula or TestThresholds or TestHysteresis"

  structure-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 8 E-Trike packages exist
        run: |
          for pkg in autoware_vehicle_bridge etrike_protocol etrike_vehicle_description etrike_vehicle_launch etrike_sensor_kit_description etrike_sensor_kit_launch etrike_common_launch etrike_stability_guard; do
            if [ ! -d "autoware/src/our_packages/$pkg" ]; then
              echo "MISSING: $pkg"
              exit 1
            fi
          done
          echo "All 8 packages present"
      - name: Verify autoware.repos exists and is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('repositories/autoware.repos'))"
      - name: Verify UPSTREAM_MODIFICATIONS.md exists
        run: test -f UPSTREAM_MODIFICATIONS.md
