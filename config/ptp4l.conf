[ptp4l]
# PTP configuration for Jetson Orin as a PTP slave.
# The XT32M2X and Jetson are both PTP slaves; the grandmaster is external.
#
# Transport: UDP (L2 can be used on dedicated links)
# Profile: IEEE 1588v2
# Domain: 0

# Run as a slave-only instance (do not act as master)
slaveOnly               1

# Network transport: UDPv4 (use L2 for direct connections)
networkTransport        UDPv4

# PTP domain number
domainNumber            0

# Use software timestamping (hardware is better if NIC supports it)
time_stamping           software

# Use the default PTPv2 delay mechanism
delay_mechanism         E2E

# Logging
logging_level           6
verbose                 1

# Clock class and accuracy for a slave
clockClass              248
clockAccuracy           0xFE
offsetScaledLogVariance 0xFFFF

priority1               128
priority2               128

# Time scale: PTP (not ARB)
timeSource              0xA0

# Polling interval (log2 seconds): 1 = 2s, 0 = 1s
logSyncInterval         0
logAnnounceInterval     1
logDelayReqInterval     0

# Servo parameters for stable convergence
pi_proportional_const   0.7
pi_integral_const       0.3

# Disable hardware timestamping fallback warning
tx_timestamp_timeout    50
