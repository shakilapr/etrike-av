/**:
  ros__parameters:
    # Autoware defines base_link at the center of the rear axle.
    simulated_frame_id: "base_link"
    origin_frame_id: "map"

    # Use the ideal model until actuator delays are measured on the vehicle.
    vehicle_model_type: "IDEAL_STEER_VEL"
    initialize_source: "INITIAL_POSE_TOPIC"
    timer_sampling_time_ms: 25
    add_measurement_noise: false

    # Limits synchronized with the vehicle bridge and documented geometry.
    vel_lim: 3.0
    vel_rate_lim: 2.0
    steer_lim: 0.747
    steer_rate_lim: 1.5

    # Retained for compatibility if a delayed model is selected after calibration.
    acc_time_delay: 0.0
    acc_time_constant: 0.1
    steer_time_delay: 0.0
    steer_time_constant: 0.1
    steer_dead_band: 0.0
    x_stddev: 0.0001
    y_stddev: 0.0001
    enable_road_slope_simulation: true
