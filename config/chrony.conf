# chrony configuration for the E-Trike Jetson Orin.
# Steers the system clock from PTP (ptp4l) and provides NTP fallback.
#
# PTP grandmaster -> ptp4l (eth0) -> chrony -> system clock
# This ensures the Autoware PC clock stays synchronized with the lidar.

# Use the PTP servo (phc2sys writes to the system clock via ptp4l)
# chrony can also reference the PTP clock as a source
refclock PHC /dev/ptp0 poll 2 dpoll -2 offset 0 stratum 2

# Fallback NTP servers (for bench/lab use without GNSS/PTP)
server pool.ntp.org iburst minpoll 6 maxpoll 10

# Allow the system clock to be stepped if the offset is large at startup
makestep 1.0 3

# Enable hardware timestamping
hwtimestamp *

# Drift file
driftfile /var/lib/chrony/drift

# Allow rapid slew at startup
rtcsync

# Log
logdir /var/log/chrony
log measurements statistics tracking
